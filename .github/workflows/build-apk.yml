name: Build Shorts Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install NPM Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Configure Android WebView Autoplay & MixedContent
        run: |
          mkdir -p android/app/src/main/java/com/shorts/v2/
          cat << 'EOF' > android/app/src/main/java/com/shorts/v2/MainActivity.java
          package com.shorts.v2;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebSettings settings = this.bridge.getWebView().getSettings();
                          settings.setMediaPlaybackRequiresUserGesture(false);
                          settings.setDomStorageEnabled(true);
                          settings.setAllowFileAccess(true);
                          settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }
                  } catch (Exception e) {}
              }
          }
          EOF

      - name: Sync Web Assets
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Prepare Final APK
        run: |
          mkdir -p output
          find android/ -name "*debug*.apk" -exec cp {} output/Shorts-v4.apk \;
          ls -la output/

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-v4-APK
          path: output/Shorts-v4.apk
          if-no-files-found: error
          retention-days: 30
